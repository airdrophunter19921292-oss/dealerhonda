name: Extract ZIP to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o "project web Honda_v5.zip" -d extracted

      - name: Copy extracted files to repository
        run: |
          cp -r extracted/. .

      - name: Remove temporary folder
        run: |
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract project web Honda v5"
            git push
          fi
